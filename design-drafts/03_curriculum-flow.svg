<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="phase1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0077b6;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#0077b6;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="phase2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00b4d8;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#00b4d8;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="phase3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#023e8a;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#023e8a;stop-opacity:0.05" />
    </linearGradient>
  </defs>
  <rect width="800" height="420" fill="#ffffff"/>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" fill="#1a1a2e" font-size="20" font-weight="700">AX Academy カリキュラム全体像</text>
  <text x="400" y="55" text-anchor="middle" fill="#666666" font-size="13">2ヶ月・3フェーズの実践プログラム</text>

  <!-- Timeline bar -->
  <rect x="50" y="75" width="700" height="8" fill="#e9ecef" rx="4"/>
  <!-- Phase segments on timeline -->
  <rect x="50" y="75" width="260" height="8" fill="#0077b6" fill-opacity="0.6" rx="4"/>
  <rect x="310" y="75" width="310" height="8" fill="#00b4d8" fill-opacity="0.6"/>
  <rect x="620" y="75" width="130" height="8" fill="#023e8a" fill-opacity="0.6" rx="0 4 4 0"/>

  <!-- Week labels -->
  <text x="50" y="100" fill="#888888" font-size="10">Week 1</text>
  <text x="180" y="100" fill="#888888" font-size="10">Week 3</text>
  <text x="310" y="100" fill="#888888" font-size="10">Week 4</text>
  <text x="540" y="100" fill="#888888" font-size="10">Week 7</text>
  <text x="620" y="100" fill="#888888" font-size="10">Week 8</text>
  <text x="720" y="100" fill="#888888" font-size="10">修了</text>

  <!-- Phase 1 -->
  <rect x="30" y="115" width="280" height="250" fill="url(#phase1)" rx="12" stroke="#0077b6" stroke-opacity="0.2" stroke-width="1"/>
  <rect x="30" y="115" width="280" height="45" fill="#0077b6" fill-opacity="0.1" rx="12"/>
  <rect x="30" y="148" width="280" height="12" fill="#0077b6" fill-opacity="0.1"/>
  <text x="55" y="133" fill="#0077b6" font-size="11" font-weight="700">PHASE 1</text>
  <text x="55" y="150" fill="#1a1a2e" font-size="14" font-weight="600">AXの全体像と思考法</text>
  <text x="55" y="163" fill="#666666" font-size="10">Week 1〜3（3週間）</text>

  <g fill="#444444" font-size="11">
    <circle cx="55" cy="190" r="3" fill="#0077b6" fill-opacity="0.4"/>
    <text x="65" y="194">AXとは何か：本質とDXとの違い</text>
    <circle cx="55" cy="215" r="3" fill="#0077b6" fill-opacity="0.4"/>
    <text x="65" y="219">AI活用領域マップの把握</text>
    <circle cx="55" cy="240" r="3" fill="#0077b6" fill-opacity="0.4"/>
    <text x="65" y="244">AIプロジェクトの進め方</text>
    <circle cx="55" cy="265" r="3" fill="#0077b6" fill-opacity="0.4"/>
    <text x="65" y="269">自社AX戦略立案</text>
  </g>

  <!-- Output label Phase 1 -->
  <rect x="55" y="300" width="120" height="26" fill="#0077b6" fill-opacity="0.1" rx="13" stroke="#0077b6" stroke-opacity="0.3" stroke-width="1"/>
  <text x="115" y="318" text-anchor="middle" fill="#0077b6" font-size="10" font-weight="600">🎯 AX戦略設計</text>

  <!-- Arrow 1→2 -->
  <polygon points="318,240 330,230 330,250" fill="#0077b6" fill-opacity="0.3"/>

  <!-- Phase 2 -->
  <rect x="340" y="115" width="280" height="250" fill="url(#phase2)" rx="12" stroke="#00b4d8" stroke-opacity="0.2" stroke-width="1"/>
  <rect x="340" y="115" width="280" height="45" fill="#00b4d8" fill-opacity="0.1" rx="12"/>
  <rect x="340" y="148" width="280" height="12" fill="#00b4d8" fill-opacity="0.1"/>
  <text x="365" y="133" fill="#00b4d8" font-size="11" font-weight="700">PHASE 2</text>
  <text x="365" y="150" fill="#1a1a2e" font-size="14" font-weight="600">製造業AIの実践技術</text>
  <text x="365" y="163" fill="#666666" font-size="10">Week 4〜7（4週間）</text>

  <g fill="#444444" font-size="11">
    <circle cx="365" cy="190" r="3" fill="#00b4d8" fill-opacity="0.4"/>
    <text x="375" y="194">データ収集と前処理</text>
    <circle cx="365" cy="215" r="3" fill="#00b4d8" fill-opacity="0.4"/>
    <text x="375" y="219">予知保全AI（異常検知）</text>
    <circle cx="365" cy="240" r="3" fill="#00b4d8" fill-opacity="0.4"/>
    <text x="375" y="244">品質管理AI（画像検査）</text>
    <circle cx="365" cy="265" r="3" fill="#00b4d8" fill-opacity="0.4"/>
    <text x="375" y="269">生産最適化と需要予測</text>
  </g>

  <rect x="365" y="300" width="140" height="26" fill="#00b4d8" fill-opacity="0.1" rx="13" stroke="#00b4d8" stroke-opacity="0.3" stroke-width="1"/>
  <text x="435" y="318" text-anchor="middle" fill="#00b4d8" font-size="10" font-weight="600">🔧 実装スキル習得</text>

  <!-- Arrow 2→3 -->
  <polygon points="628,240 640,230 640,250" fill="#00b4d8" fill-opacity="0.3"/>

  <!-- Phase 3 -->
  <rect x="650" y="115" width="130" height="250" fill="url(#phase3)" rx="12" stroke="#023e8a" stroke-opacity="0.2" stroke-width="1"/>
  <rect x="650" y="115" width="130" height="45" fill="#023e8a" fill-opacity="0.1" rx="12"/>
  <rect x="650" y="148" width="130" height="12" fill="#023e8a" fill-opacity="0.1"/>
  <text x="670" y="133" fill="#023e8a" font-size="11" font-weight="700">PHASE 3</text>
  <text x="670" y="150" fill="#1a1a2e" font-size="13" font-weight="600">適用と展開</text>
  <text x="670" y="163" fill="#666666" font-size="10">Week 8</text>

  <g fill="#444444" font-size="10.5">
    <circle cx="670" cy="190" r="3" fill="#023e8a" fill-opacity="0.4"/>
    <text x="680" y="194">AI適用設計</text>
    <circle cx="670" cy="215" r="3" fill="#023e8a" fill-opacity="0.4"/>
    <text x="680" y="219">展開計画策定</text>
    <circle cx="670" cy="240" r="3" fill="#023e8a" fill-opacity="0.4"/>
    <text x="680" y="244">最終発表</text>
    <circle cx="670" cy="265" r="3" fill="#023e8a" fill-opacity="0.4"/>
    <text x="680" y="269">フォローアップ</text>
  </g>

  <rect x="660" y="300" width="110" height="26" fill="#023e8a" fill-opacity="0.1" rx="13" stroke="#023e8a" stroke-opacity="0.3" stroke-width="1"/>
  <text x="715" y="318" text-anchor="middle" fill="#023e8a" font-size="10" font-weight="600">🚀 PoC実装完了</text>

  <!-- Bottom: Mentorship bar -->
  <rect x="30" y="380" width="750" height="30" fill="#0077b6" fill-opacity="0.05" rx="6" stroke="#0077b6" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="400" y="400" text-anchor="middle" fill="#0077b6" font-size="12" font-weight="500">全フェーズ通じてメンターが伴走支援 ── 完全オンライン対応</text>

  <!-- Footer -->
  <text x="400" y="418" text-anchor="middle" fill="#999999" font-size="9">DESIGN DRAFT - タイムライン＋3フェーズカード構成</text>
</svg>
