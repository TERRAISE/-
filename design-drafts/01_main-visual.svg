<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="'Helvetica Neue', Arial, sans-serif">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3a5c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00b4d8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0077b6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Abstract circuit/AI pattern - decorative lines -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" fill="none">
    <line x1="0" y1="100" x2="250" y2="100"/>
    <line x1="250" y1="100" x2="280" y2="130"/>
    <line x1="280" y1="130" x2="400" y2="130"/>
    <line x1="0" y1="200" x2="150" y2="200"/>
    <line x1="150" y1="200" x2="180" y2="230"/>
    <line x1="0" y1="350" x2="200" y2="350"/>
    <line x1="200" y1="350" x2="230" y2="320"/>
    <line x1="600" y1="50" x2="800" y2="50"/>
    <line x1="550" y1="150" x2="800" y2="150"/>
    <line x1="650" y1="300" x2="800" y2="300"/>
    <line x1="650" y1="300" x2="680" y2="330"/>
    <line x1="680" y1="330" x2="800" y2="330"/>
  </g>
  <!-- Circuit nodes -->
  <g fill="#00b4d8" fill-opacity="0.15">
    <circle cx="250" cy="100" r="4"/>
    <circle cx="150" cy="200" r="4"/>
    <circle cx="200" cy="350" r="4"/>
    <circle cx="650" cy="300" r="4"/>
  </g>

  <!-- Factory silhouette (right side, subtle) -->
  <g fill="#ffffff" fill-opacity="0.04">
    <rect x="580" y="280" width="60" height="170"/>
    <rect x="650" y="320" width="50" height="130"/>
    <rect x="710" y="300" width="40" height="150"/>
    <rect x="760" y="340" width="40" height="110"/>
    <rect x="595" y="250" width="10" height="40"/>
    <rect x="620" y="260" width="10" height="30"/>
    <rect x="720" y="270" width="8" height="35"/>
  </g>

  <!-- Company logo area -->
  <text x="50" y="60" fill="#ffffff" fill-opacity="0.5" font-size="14" font-weight="400">株式会社TERRAISE</text>

  <!-- Accent line -->
  <rect x="50" y="80" width="80" height="3" fill="url(#accent)" rx="1.5"/>

  <!-- Main title -->
  <text x="50" y="150" fill="#ffffff" font-size="42" font-weight="700" letter-spacing="2">AX Academy</text>
  <text x="50" y="195" fill="#00b4d8" font-size="18" font-weight="500" letter-spacing="1">AI Transformation 実践スクール</text>

  <!-- Subtitle -->
  <text x="50" y="245" fill="#ffffff" fill-opacity="0.9" font-size="20" font-weight="600">中堅製造業向けAI人材育成プログラム</text>

  <!-- Tagline -->
  <rect x="50" y="270" width="420" height="40" fill="#00b4d8" fill-opacity="0.15" rx="4"/>
  <text x="70" y="296" fill="#00b4d8" font-size="16" font-weight="500">2ヶ月で"自走できるAX推進人材"を育成</text>

  <!-- Key message -->
  <text x="50" y="355" fill="#ffffff" fill-opacity="0.7" font-size="15">研修・コンサルの繰り返しを、これで終わらせる。</text>

  <!-- CTA area -->
  <rect x="50" y="380" width="220" height="40" fill="url(#accent)" rx="20"/>
  <text x="100" y="405" fill="#ffffff" font-size="14" font-weight="600">第1期モニター 5名限定</text>

  <text x="290" y="405" fill="#ffffff" fill-opacity="0.5" font-size="13">完全オンライン伴走型</text>

  <!-- Design note -->
  <rect x="0" y="435" width="800" height="15" fill="#000000" fill-opacity="0.3"/>
  <text x="400" y="446" fill="#ffffff" fill-opacity="0.4" font-size="9" text-anchor="middle">DESIGN DRAFT - メインビジュアル案: ダークブルー基調 × 回路パターン × 工場シルエット</text>
</svg>
